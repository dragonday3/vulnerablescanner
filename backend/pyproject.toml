[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/ (Alembic env + autogenerated revision scripts) is excluded:
# revision files are machine-generated and out of scope for hand-formatting.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...)/Query(...) in argument defaults is the standard FastAPI
# idiom (FastAPI evaluates the default itself on each request); it is not a
# bug here, so it's excluded rather than reworking every route signature.
# UP042: would require rebasing TargetType/ScanStatus off enum.StrEnum
# instead of (str, Enum) - a behavioral change to already-reviewed models,
# out of scope for a lint-config task, so left as a style preference.
ignore = ["B008", "UP042"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
