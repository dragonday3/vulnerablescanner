name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnsight
          POSTGRES_PASSWORD: vulnsight
          POSTGRES_DB: vulnsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulnsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # test_nmap_scanner.py skips itself (shutil.which("nmap") is None) when
      # this isn't installed, but the real backend/worker Docker image always
      # has it - install it here too so CI exercises the same test coverage.
      - name: Install nmap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nmap

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        working-directory: backend
        run: ruff check .

      - name: black
        working-directory: backend
        run: black --check .

      - name: mypy
        working-directory: backend
        run: mypy app

      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://vulnsight:vulnsight@localhost:5432/vulnsight
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: lint
        working-directory: frontend
        run: npm run lint

      # Not `tsc --noEmit`: this project uses Next's typed routes, and the
      # PageProps/LayoutProps globals they rely on are only generated by
      # `next build`/`next dev` itself - a standalone tsc run against a
      # checkout that has never been built fails with "Cannot find name
      # 'PageProps'" on every dynamic route, which isn't a real type error.
      # `next build` generates those types and then runs its own internal
      # type-check pass, so it's the correct equivalent here.
      - name: Build (includes type check)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          API_INTERNAL_URL: http://localhost:8000/api/v1
        run: npm run build
